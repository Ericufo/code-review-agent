
name: Python Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  api-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: review_test
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: review_test_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U review_test -d review_test_admin"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      REVIEW_TEST_DATABASE_URL: postgresql+psycopg://review_test:ci-test-only-password@127.0.0.1:5432/review_test_admin
      REVIEW_MODEL_MODE: mock
      GITHUB_TOKEN: ""
      DEEPSEEK_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
      - name: Install API and test dependencies
        run: |
          python -m pip install -r requirements-api.txt
          python -m pip check
      - name: Run isolated real PostgreSQL and offline HTTP tests
        run: python scripts/run_postgres_tests.py
      - name: Verify frozen dataset and mock evaluation
        run: |
          python -m evals.dataset
          python -m evals.runner --split all --output evals/runs/ci-offline

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REVIEW_MODEL_MODE: mock
      GITHUB_TOKEN: ""
      DEEPSEEK_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build and verify isolated offline Compose deployment
        run: python scripts/verify_compose.py
