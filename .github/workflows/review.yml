name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# PR conversation comments accept pull-requests: write; no personal token needed.
permissions:
  contents: read
  pull-requests: write

# A new commit supersedes the previous review of the same PR.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # This job executes repository code with an API key. Only collaborators'
    # same-repository PRs are supported. Forks and Dependabot still run tests.yml.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check model configuration
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Set the repository Actions secret DEEPSEEK_API_KEY before running PR Review."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Review current PR and update summary comment
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_COMMENT_AUTHOR: github-actions[bot]
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONUNBUFFERED: "1"
        run: >-
          python main.py --github-pr "$PR_NUMBER"
          --expected-head-sha "$EXPECTED_HEAD_SHA"
          --context repo --trace
          --max-model-calls 128 --max-tool-calls 256
          --max-context-chars 800000 --max-input-chars 6000000
